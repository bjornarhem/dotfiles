#[ids]
#*
#
#[main]
## Make leftalt activate a navigation layer when held
#leftalt = layer(nav)
#
#[nav]
## While holding the modifier, these keys become arrows.
#h = left
#j = down
#k = up
#l = right
#
## CRITICAL: Preserve the native function of the Alt modifier for all other keys.
## The 'meta' keyword tells keyd to pass the original Alt state through.
#meta = layer(meta)
#
#[meta]
## This empty layer ensures Alt combinations like Alt+Tab, Alt+F4 work normally.
#
